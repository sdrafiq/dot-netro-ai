<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ডট নেত্র এআই</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 90%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            display: flex;
            flex-direction: column;
            height: 80vh;
        }
        h2 { text-align: center; margin-top: 0; color: #00e5ff; }
        .chat-box {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message { padding: 10px 15px; border-radius: 15px; max-width: 80%; line-height: 1.4; }
        .user-msg { background: #00e5ff; color: #000; align-self: flex-end; border-bottom-right-radius: 0; }
        .ai-msg { background: rgba(255,255,255,0.2); color: #fff; align-self: flex-start; border-bottom-left-radius: 0; }
        .input-group { display: flex; gap: 10px; }
        input {
            flex-grow: 1;
            padding: 15px;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 16px;
            outline: none;
        }
        input::placeholder { color: #ccc; }
        button {
            padding: 15px 20px;
            border-radius: 10px;
            border: none;
            background: #00e5ff;
            color: black;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #00b3cc; }
    </style>
</head>
<body>

    <div class="container">
        <h2>ডট নেত্র কমান্ড সেন্টার 🤖</h2>
        <div class="chat-box" id="chat-box">
            <div class="message ai-msg">হ্যালো বস! আমি ডট নেত্র। আমাকে কোনো লিংক দিয়ে পড়তে বলতে পারেন, অথবা পিসি কন্ট্রোল করতে নির্দেশ দিন।</div>
        </div>
        <div class="input-group">
            <input type="text" id="user-input" placeholder="আপনার নির্দেশ লিখুন..." onkeypress="handleEnter(event)">
            <button onclick="sendMessage()">পাঠান</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById("chat-box");
        const userInput = document.getElementById("user-input");

        function handleEnter(e) { if(e.key === "Enter") sendMessage(); }

        async function sendMessage() {
            let message = userInput.value.trim();
            if (!message) return;

            // Show User Message
            chatBox.innerHTML += `<div class="message user-msg">${message}</div>`;
            userInput.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // Show Loading
            let loadingId = "load-" + Date.now();
            chatBox.innerHTML += `<div class="message ai-msg" id="${loadingId}">ভাবছি... ⏳</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Send Request to Python Backend
                let response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: message })
                });
                
                let data = await response.json();
                
                // Replace loading with actual response
                document.getElementById(loadingId).innerText = data.response;
            } catch (error) {
                document.getElementById(loadingId).innerText = "❌ সার্ভারের সাথে কানেক্ট করা যায়নি!";
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
